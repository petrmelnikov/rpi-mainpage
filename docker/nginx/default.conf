server {
    listen 80;
    server_name _;

    root /app;
    index index.php index.html;

    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # User-uploaded tools are always served as static files. The ^~ prefix keeps
    # files such as *.php away from the PHP-FPM location below.
    location ^~ /tools/hosted/ {
        alias /app-data/hosted-tools/apps/;
        index index.html index.htm;
        autoindex off;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
    }

    # HLS artifacts can only be reached after the PHP controller validates the
    # unguessable session id and artifact name and returns X-Accel-Redirect.
    location ^~ /_internal/transcodes/ {
        internal;
        alias /app-data/transcodes/;
        types {
            video/mp4 mp4;
            video/iso.segment m4s;
        }
        default_type application/octet-stream;
        autoindex off;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ /\.ht {
        deny all;
    }
}
