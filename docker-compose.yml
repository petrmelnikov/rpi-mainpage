services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rpi-mainpage-app
    volumes:
      - ./:/app
      - ${HOST_MEDIA_ROOT:-/media}:/media
    env_file:
      - .env.ssh
    environment:
      SHELL_OVER_SSH: "1"
      # Keep app state on host-mounted storage so data survives container rebuilds.
      UPLOAD_BASE_DIR: /media/.rpi-mainpage-data
      MEDIA_FFMPEG_BIN: /usr/local/bin/ffmpeg
      MEDIA_FFPROBE_BIN: /usr/local/bin/ffprobe
      MEDIA_PHP_CLI_BIN: /usr/local/bin/php
      MEDIA_TRANSCODE_DIR: /media/.rpi-mainpage-data/transcodes
      MEDIA_HLS_SEGMENT_SECONDS: ${MEDIA_HLS_SEGMENT_SECONDS:-4}
      MEDIA_HLS_BATCH_SEGMENTS: ${MEDIA_HLS_BATCH_SEGMENTS:-4}
      MEDIA_SEGMENT_WAIT_SECONDS: ${MEDIA_SEGMENT_WAIT_SECONDS:-30}
      MEDIA_WORKER_IDLE_SECONDS: ${MEDIA_WORKER_IDLE_SECONDS:-15}
      MEDIA_MAX_SESSIONS: ${MEDIA_MAX_SESSIONS:-3}
      MEDIA_SESSION_TTL_SECONDS: ${MEDIA_SESSION_TTL_SECONDS:-1800}
      APP_RUN_USER: ${APP_RUN_USER:-ubuntu}
      APP_RUN_GROUPS: ${APP_RUN_GROUPS:-www-data}
      SSH_REMOTE_HOST: ${SSH_REMOTE_HOST:-host.docker.internal}
      SSH_REMOTE_PORT: ${SSH_REMOTE_PORT:-22}
      SSH_REMOTE_USER: ${SSH_REMOTE_USER:-ubuntu}
      SSH_REMOTE_APP_DIR: ${SSH_REMOTE_APP_DIR:-/apps/rpi-mainpage}
      SSH_CONTROL_PATH: /tmp/ssh/cm-%r@%h:%p
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/usr/local/bin/init-ssh-and-run.sh", "php-fpm", "-F"]

  nginx:
    image: nginx:1.27-alpine
    container_name: rpi-mainpage-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOST_MEDIA_ROOT:-/media}/.rpi-mainpage-data:/app-data:ro
